<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Debit Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Layout: plain white page, one slim track with a round handle that rests in the middle. */
  :root {
    --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

    --page: #ffffff;
    --ink: #14181c;
    --ink-soft: #66707b;
    --track-idle: #f1f4f7;
    --edge: #e0e5eb;
    --handle-idle: #ffffff;
    --credit: #12884b;
    --debit: #d93b3b;
    --credit-ink: #0d7040;
    --debit-ink: #b92d2d;

    /* live weights written by the script */
    --c: 0;
    --d: 0;

    --track: color-mix(in srgb, var(--credit) calc(var(--c) * 14%), color-mix(in srgb, var(--debit) calc(var(--d) * 14%), var(--track-idle)));
    --handle: color-mix(in srgb, var(--credit) calc(var(--c) * 100%), color-mix(in srgb, var(--debit) calc(var(--d) * 100%), var(--handle-idle)));
    --handle-ink: color-mix(in srgb, #ffffff calc((var(--c) + var(--d)) * 100%), var(--ink-soft));
    --glow: color-mix(in srgb, var(--credit) calc(var(--c) * 38%), color-mix(in srgb, var(--debit) calc(var(--d) * 38%), rgba(20, 24, 28, 0.16)));

    color-scheme: light;
  }
  @supports not (color: color-mix(in srgb, red, blue)) {
    :root { --track: var(--track-idle); --handle: var(--handle-idle); --handle-ink: var(--ink-soft); --glow: rgba(20, 24, 28, 0.2); }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  .field { width: min(100%, 320px); min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .field-label { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-soft); }

  .track {
    --hs: 52px;
    position: relative;
    height: 60px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: var(--track);
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .handle {
    position: absolute;
    top: 3px;
    left: calc(50% - var(--hs) / 2);
    width: var(--hs);
    height: var(--hs);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--handle);
    color: var(--handle-ink);
    box-shadow: 0 4px 12px var(--glow), 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent);
    cursor: grab;
    touch-action: pan-y;
    will-change: transform;
    transition: scale 0.18s ease;
  }
  @supports not (color: color-mix(in srgb, red, blue)) {
    .handle { box-shadow: 0 3px 10px rgba(20, 24, 28, 0.2); }
  }
  .track.dragging .handle { scale: 1.06; cursor: grabbing; }
  .handle:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .handle svg {
    grid-area: 1 / 1;
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .i-idle   { opacity: calc(1 - var(--c) - var(--d)); }
  .i-credit { opacity: var(--c); }
  .i-debit  { opacity: var(--d); }

  .labels { display: flex; justify-content: space-between; gap: 12px; margin-top: -2px; }
  .label {
    appearance: none;
    border: 0;
    background: none;
    min-height: 44px;
    padding: 6px 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .label.credit { color: color-mix(in srgb, var(--credit-ink) calc(var(--c) * 100%), var(--ink-soft)); }
  .label.debit  { color: color-mix(in srgb, var(--debit-ink) calc(var(--d) * 100%), var(--ink-soft)); }
  @supports not (color: color-mix(in srgb, red, blue)) {
    .label.credit, .label.debit { color: var(--ink-soft); }
  }
  .label svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .label:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) { .handle { transition: none; } }
</style>
</head>
<body>

<main class="field">
  <p class="field-label" id="lbl">Transaction type</p>

  <div class="track" id="track">
    <div class="handle" id="handle" role="slider" tabindex="0"
         aria-labelledby="lbl" aria-orientation="horizontal"
         aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="Not selected">
      <svg class="i-idle" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>
      <svg class="i-credit" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.8"/><path d="M5 5.5v13c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-13M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/></svg>
      <svg class="i-debit" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>
    </div>
  </div>

  <div class="labels">
    <button class="label credit" id="btnC" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="2.8"/><path d="M5 5.5v13c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-13M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/></svg>
      Credit
    </button>
    <button class="label debit" id="btnD" type="button" aria-pressed="false">
      Debit
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>
    </button>
  </div>
</main>

<script>
(function () {
  var root = document.documentElement;
  var track = document.getElementById('track');
  var handle = document.getElementById('handle');
  var btnC = document.getElementById('btnC');
  var btnD = document.getElementById('btnD');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var PAD = 3;

  var VALUE_TEXT = { '-1': 'Credit', '0': 'Not selected', '1': 'Debit' };

  var value = 0;   // -1 credit, 0 none (middle), 1 debit
  var cur = 0;     // handle position, -1..1
  var target = 0;
  var travel = 0;
  var raf = 0;
  var last = 0;
  var drag = null;

  function clamp(n) { return Math.max(-1, Math.min(1, n)); }
  function nearest(p) { return p < -0.5 ? -1 : p > 0.5 ? 1 : 0; }

  function measure() {
    travel = Math.max(0, (track.clientWidth - handle.offsetWidth) / 2 - PAD);
    paint(cur);
  }

  function paint(p) {
    cur = p;
    root.style.setProperty('--c', Math.max(0, -p).toFixed(4));
    root.style.setProperty('--d', Math.max(0, p).toFixed(4));
    handle.style.transform = 'translateX(' + (p * travel).toFixed(2) + 'px)';
  }

  function step(t) {
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    cur += (target - cur) * (1 - Math.exp(-dt * 11));
    if (Math.abs(target - cur) < 0.002) { paint(target); raf = 0; return; }
    paint(cur);
    raf = requestAnimationFrame(step);
  }

  function animateTo(v) {
    target = v;
    if (reduce.matches) { paint(v); return; }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
  }

  function render(v) {
    handle.setAttribute('aria-valuenow', String(v));
    handle.setAttribute('aria-valuetext', VALUE_TEXT[String(v)]);
    btnC.setAttribute('aria-pressed', String(v === -1));
    btnD.setAttribute('aria-pressed', String(v === 1));
  }

  function setValue(v) {
    var changed = v !== value;
    value = v;
    render(v);
    animateTo(v);
    if (changed) {
      track.dispatchEvent(new CustomEvent('typechange', {
        bubbles: true,
        detail: { value: v === -1 ? 'credit' : v === 1 ? 'debit' : null }
      }));
    }
  }

  /* drag: pointer events cover mouse, touch and pen */
  handle.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.stopPropagation();
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    drag = { x: e.clientX, p: cur, moved: false };
    track.classList.add('dragging');
  });

  handle.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 3) drag.moved = true;
    if (!drag.moved || !travel) return;
    var p = clamp(drag.p + dx / travel);
    paint(p);
    render(nearest(p));
  });

  function endDrag(e, cancelled) {
    if (!drag) return;
    var d = drag;
    drag = null;
    track.classList.remove('dragging');
    try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
    if (cancelled) { render(value); animateTo(value); return; }
    if (d.moved) setValue(nearest(cur));
    else if (value !== 0) setValue(0);
  }
  handle.addEventListener('pointerup', function (e) { endDrag(e, false); });
  handle.addEventListener('pointercancel', function (e) { endDrag(e, true); });

  /* tap the bare track: left third = credit, right third = debit */
  track.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.handle')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var r = track.getBoundingClientRect();
    var f = (e.clientX - r.left) / r.width;
    setValue(f < 1 / 3 ? -1 : f > 2 / 3 ? 1 : 0);
  });

  btnC.addEventListener('click', function () { setValue(-1); });
  btnD.addEventListener('click', function () { setValue(1); });

  /* keyboard */
  handle.addEventListener('keydown', function (e) {
    var k = e.key, handled = true;
    if (k === 'ArrowLeft' || k === 'ArrowDown') setValue(Math.max(-1, value - 1));
    else if (k === 'ArrowRight' || k === 'ArrowUp') setValue(Math.min(1, value + 1));
    else if (k === 'Home') setValue(-1);
    else if (k === 'End') setValue(1);
    else if (k === 'Escape' || k === 'Enter' || k === ' ') setValue(0);
    else handled = false;
    if (handled) e.preventDefault();
  });

  if (window.ResizeObserver) new ResizeObserver(measure).observe(track);
  else window.addEventListener('resize', measure);
  measure();
  render(0);
})();
</script>
</body>
</html>
